# ==========================================
# Server Configuration
# ==========================================
# Render assigns the port via the PORT env var (10000). The default must match
# the exposed port so the app also binds correctly outside Render.
server.port=${PORT:10000}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# ==========================================
# Actuator / Health Check
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Hikari Connection Pool
# ==========================================
spring.datasource.hikari.pool-name=ExamSeatingPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# ==========================================
# Startup behaviour
# ==========================================
# Do NOT enable lazy-initialization: the security filter chain depends on
# AdminRepository, so a lazy context would build the JPA/EntityManagerFactory
# on the first HTTP request. Render's health check has a 5s timeout, so the
# whole context must be ready BEFORE Tomcat starts listening.
spring.main.banner-mode=off

# ==========================================
# JWT Authentication
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# CORS
# ==========================================
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# Logging
# ==========================================
logging.level.root=INFO
logging.level.com.rit=INFO
logging.level.com.zaxxer.hikari=INFO

# ==========================================
# Circular References
# ==========================================
spring.main.allow-circular-references=true
