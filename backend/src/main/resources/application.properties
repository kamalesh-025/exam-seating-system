# ==================================================
# EXAM SEATING SYSTEM - PRODUCTION CONFIGURATION
# ==================================================

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# ==================================================
# DATABASE CONFIGURATION
# ==================================================

# These variables MUST be configured in Render.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.pool-name=ExamSeatingHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1500000

# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ==================================================
# JWT AUTHENTICATION
# ==================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==================================================
# FILE UPLOAD
# ==================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================================================
# CORS
# ==================================================

cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ==================================================
# LOGGING
# ==================================================

logging.level.root=INFO
logging.level.com.rit=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO

# ==================================================
# SPRING
# ==================================================

spring.main.allow-circular-references=true
