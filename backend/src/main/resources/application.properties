# ============================================
# application.properties - Spring Boot Config
# ============================================

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam_seating_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (change this in production)
jwt.secret=${JWT_SECRET:ExamSeatingSystemSecretKey2024RITCollegeJWTToken}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (React frontend)
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.rit=INFO
spring.main.allow-circular-references=true