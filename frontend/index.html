<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamSeat — RIT Exam Cell Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'DM Sans', sans-serif; background: #f0f2f5; overflow-x: hidden; }
 
      /* Mobile Global Fixes */
      @media (max-width: 768px) {
        aside { 
          display: none !important; 
        }
        main { 
          padding: 16px !important; 
          width: 100vw !important;
          margin-left: 0 !important;
        }
        /* Grid and Flex Layouts */
        .statsGrid, .row, .actionsGrid, .grid, .resultGrid, .instrGrid {
          grid-template-columns: 1fr !important;
          display: grid !important;
          gap: 12px !important;
        }
        /* Forms and Inputs */
        input, select, button {
          width: 100% !important;
          max-width: 100% !important;
        }
        /* Card Paddings */
        .card, .scanCard, .logCard, .resultCard, .blockSection {
          padding: 20px 16px !important;
          border-radius: 12px !important;
        }
        /* Typography */
        h1 { font-size: 24px !important; }
        .heroTitle { font-size: 32px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
